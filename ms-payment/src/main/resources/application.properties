spring.application.name=ms-payment
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8092}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco_xyz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banco}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:localhost}:${server.port}
management.endpoints.web.exposure.include=health,info
account.service.url=${ACCOUNT_SERVICE_URL:http://ms-account}
app.oauth.token-url=${OAUTH_TOKEN_URL:http://auth-server:9000/oauth2/token}
app.oauth.client-secret=${OAUTH_PAYMENT_SECRET:payment-secret}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=5000
resilience4j.retry.instances.accounts.max-attempts=3
account.retry.wait-ms=300
resilience4j.circuitbreaker.instances.accounts.sliding-window-size=5
resilience4j.circuitbreaker.instances.accounts.minimum-number-of-calls=3
account.circuitbreaker.open-seconds=10
