spring.application.name=ms-account
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8091}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco_xyz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banco}
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
