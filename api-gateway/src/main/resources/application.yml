spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      routes:
        - id: bff-web
          uri: lb://bff-web
          predicates:
            - Path=/gateway/web/**
          filters:
            - RewritePath=/gateway/(?<segment>.*), /$\{segment}
        - id: bff-mobile
          uri: lb://bff-mobile
          predicates:
            - Path=/gateway/mobile/**
          filters:
            - RewritePath=/gateway/(?<segment>.*), /$\{segment}
        - id: bff-atm
          uri: lb://bff-atm
          predicates:
            - Path=/gateway/atm/**
          filters:
            - RewritePath=/gateway/(?<segment>.*), /$\{segment}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
