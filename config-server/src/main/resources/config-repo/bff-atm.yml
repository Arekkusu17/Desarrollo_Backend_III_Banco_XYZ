server:
  port: 8083
  ssl:
    enabled: ${BFF_SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: bff-local

core:
  banking:
    url: ${CORE_BANKING_URL:http://core-banking}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: cl.duoc.backendiii.events
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

channel:
  name: ATM
  path-pattern: /atm/**
  scope: atm.read

atm:
  max-withdrawal-amount: 200000

app:
  oauth:
    token-url: ${OAUTH_TOKEN_URL:http://auth-server:9000/oauth2/token}
    client-id: ${OAUTH_CLIENT_ID:bff-atm}
    client-secret: ${OAUTH_CLIENT_SECRET:bff-atm-secret}
    core-scope: core.read

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://auth-server:9000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
