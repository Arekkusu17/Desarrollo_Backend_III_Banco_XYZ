server:
  port: 8080

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: cl.duoc.backendiii.events
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco_xyz}
    username: ${SPRING_DATASOURCE_USERNAME:banco}
    password: ${SPRING_DATASOURCE_PASSWORD:banco}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

legacy:
  data:
    week: semana_3

batch:
  chunk-size: 5
  thread-pool-size: 3
  partition-grid-size: 3
  skip-limit: 10
  retry-limit: 2
  review-skip-threshold: 3

bank:
  transaction:
    anomaly-limit: 2500
    valid-types: debito,credito
  interest:
    monthly-rates: ahorro:0.0050,prestamo:0.0180
    min-age: 18
    max-age: 100
  annual:
    valid-transaction-types: deposito,retiro,compra,pago
    negative-amount-audit-flag: REVISION_EGRESO
    default-audit-flag: OK
    report-output: output/annual_statement_report.csv
  rejected:
    process-name-limit: 80
    record-key-limit: 120
    reason-limit: 255

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.jdbc.core: INFO
