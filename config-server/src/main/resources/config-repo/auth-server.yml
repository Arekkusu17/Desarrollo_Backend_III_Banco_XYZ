server:
  port: 9000

oauth:
  issuer: ${OAUTH_ISSUER:http://auth-server:9000}
  clients:
    demo:
      secret: ${OAUTH_DEMO_SECRET:demo-secret}
    bff-web:
      secret: ${OAUTH_BFF_WEB_SECRET:bff-web-secret}
    bff-mobile:
      secret: ${OAUTH_BFF_MOBILE_SECRET:bff-mobile-secret}
    bff-atm:
      secret: ${OAUTH_BFF_ATM_SECRET:bff-atm-secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
