server:
  port: 8082
  ssl:
    enabled: ${BFF_SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: bff-local

core:
  banking:
    url: ${CORE_BANKING_URL:http://core-banking}

channel:
  name: Mobile
  path-pattern: /mobile/**
  scope: mobile.read

app:
  oauth:
    token-url: ${OAUTH_TOKEN_URL:http://auth-server:9000/oauth2/token}
    client-id: ${OAUTH_CLIENT_ID:bff-mobile}
    client-secret: ${OAUTH_CLIENT_SECRET:bff-mobile-secret}
    core-scope: core.read

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://auth-server:9000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
