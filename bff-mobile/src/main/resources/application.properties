spring.application.name=bff-mobile
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8082
core.banking.url=${CORE_BANKING_URL:http://localhost:8080}
channel.name=Mobile
channel.path-pattern=/mobile/**
channel.scope=mobile.read
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

server.ssl.enabled=${BFF_SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}
app.oauth.token-url=${OAUTH_TOKEN_URL:http://localhost:9000/oauth2/token}
app.oauth.client-id=${OAUTH_CLIENT_ID:bff-mobile}
app.oauth.client-secret=${OAUTH_CLIENT_SECRET:bff-mobile-secret}
app.oauth.core-scope=core.read
