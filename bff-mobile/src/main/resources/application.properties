spring.application.name=bff-mobile
server.port=8082
core.banking.url=${CORE_BANKING_URL:http://localhost:8080}
channel.name=Mobile
channel.path-pattern=/mobile/**
channel.role=MOBILE

server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local

security.users.web.password=${WEB_PASSWORD:web123}
security.users.mobile.password=${MOBILE_PASSWORD:mobile123}
security.users.atm.password=${ATM_PASSWORD:atm123}
