spring.application.name=auth-server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=9000

oauth.issuer=${OAUTH_ISSUER:http://localhost:9000}
oauth.clients.demo.secret=${OAUTH_DEMO_SECRET:demo-secret}
oauth.clients.bff-web.secret=${OAUTH_BFF_WEB_SECRET:bff-web-secret}
oauth.clients.bff-mobile.secret=${OAUTH_BFF_MOBILE_SECRET:bff-mobile-secret}
oauth.clients.bff-atm.secret=${OAUTH_BFF_ATM_SECRET:bff-atm-secret}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
